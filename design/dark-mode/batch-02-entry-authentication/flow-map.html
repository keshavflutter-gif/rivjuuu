<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivjuuu · Entry & authentication flows</title>
<link rel="stylesheet" href="assets/rivjuuu.css">
<link rel="stylesheet" href="assets/dark.css">
</head>
<body class="pv">
<main class="pv-main pv-main--wide">
<div class="pv-wide" id="mount"></div>
</main>
<template id="tpl">
<div class="fm" style="width: 1640px; height: 1180px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<h1>Entry &amp; authentication flows</h1>
<div class="fm__legend">
<span><span class="n n--screen" style="min-height: 24px; padding: 2px 10px">Screen</span></span>
<span><span class="n n--state" style="min-height: 24px; padding: 2px 10px">State</span></span>
<span><span class="n n--sheet" style="min-height: 24px; padding: 2px 10px">Sheet</span></span>
<span><span class="n n--sys" style="min-height: 24px; padding: 2px 10px">System</span></span>
<span><span class="n n--os" style="min-height: 24px; padding: 2px 10px">OS / external</span></span>
<span><span class="n n--future" style="min-height: 24px; padding: 2px 10px">Later batch</span></span>
</div>
</div>

<div class="fm__row">
<div class="fm__label"><b>Customer · new account</b><span>Account Type only appears here, during registration</span></div>
<div class="fm__line">
<span class="n n--screen">Splash</span><i class="ic ic-chevron-right"></i>
<span class="n n--screen">Welcome / Login</span><i class="ic ic-chevron-right"></i>
<span class="n n--screen">Account Type<small>Customer</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--screen">Customer Sign Up</span><i class="ic ic-chevron-right"></i>
<span class="n n--state">Account created<small>success toast</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--sheet">Location permission<small>explanation sheet</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--os">Native OS prompt</span><i class="ic ic-chevron-right"></i>
<span class="n n--future">Customer Home<small>Batch 3</small></span>
</div>
</div>

<div class="fm__row">
<div class="fm__label"><b>Customer · returning</b><span>Splash decides the destination</span></div>
<div class="fm__line">
<span class="n n--screen">Splash</span><i class="ic ic-chevron-right"></i>
<span class="n n--sys">Auth check</span><i class="ic ic-chevron-right"></i>
<div class="fm__branch">
<div><span class="fm__cond">Logged in</span><i class="ic ic-chevron-right"></i><span class="n n--future">Customer Home<small>Batch 3</small></span></div>
<div><span class="fm__cond">Logged out</span><i class="ic ic-chevron-right"></i><span class="n n--screen">Welcome / Login</span><i class="ic ic-chevron-right"></i><span class="n n--sys">Log in</span><i class="ic ic-chevron-right"></i><span class="n n--future">Customer Home<small>Batch 3</small></span></div>
</div>
</div>
</div>

<div class="fm__row">
<div class="fm__label"><b>Restaurant · new account</b><span>One 4-step registration, then admin review</span></div>
<div class="fm__line">
<span class="n n--screen">Splash</span><i class="ic ic-chevron-right"></i>
<span class="n n--screen">Welcome / Login</span><i class="ic ic-chevron-right"></i>
<span class="n n--screen">Account Type<small>Restaurant</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--screen">Restaurant Sign Up<small>steps 1–3</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--state">Review &amp; submit<small>step 4</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--screen">Registration Status<small>Pending</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--state">Approved<small>after admin review</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--future">Subscription setup<small>Batch 11</small></span>
</div>
</div>

<div class="fm__row">
<div class="fm__label"><b>Restaurant · returning</b><span>Role and approval status decide the destination</span></div>
<div class="fm__line">
<span class="n n--screen">Splash</span><i class="ic ic-chevron-right"></i>
<span class="n n--sys">Auth + role check</span><i class="ic ic-chevron-right"></i>
<div class="fm__branch">
<div><span class="fm__cond">Approved</span><i class="ic ic-chevron-right"></i><span class="n n--future">Restaurant Dashboard<small>Batch 12</small></span></div>
<div><span class="fm__cond">Pending</span><i class="ic ic-chevron-right"></i><span class="n n--screen">Registration Status<small>Pending</small></span></div>
<div><span class="fm__cond">Rejected</span><i class="ic ic-chevron-right"></i><span class="n n--screen">Registration Status<small>Rejected</small></span></div>
</div>
</div>
</div>

<div class="fm__row">
<div class="fm__label"><b>Log in · role routing</b><span>One shared login, no role toggle</span></div>
<div class="fm__line">
<span class="n n--screen">Welcome / Login</span><i class="ic ic-chevron-right"></i>
<span class="n n--sys">Authenticate</span><i class="ic ic-chevron-right"></i>
<div class="fm__branch">
<div><span class="fm__cond">Customer</span><i class="ic ic-chevron-right"></i><span class="n n--future">Customer Home<small>Batch 3</small></span></div>
<div><span class="fm__cond">Approved restaurant</span><i class="ic ic-chevron-right"></i><span class="n n--future">Restaurant Dashboard<small>Batch 12</small></span></div>
<div><span class="fm__cond">Pending / rejected</span><i class="ic ic-chevron-right"></i><span class="n n--screen">Registration Status</span></div>
</div>
</div>
</div>

<div class="fm__row" style="box-shadow: none">
<div class="fm__label"><b>Password recovery</b><span>One layout, four states · no OTP assumed</span></div>
<div class="fm__line">
<span class="n n--screen">Welcome / Login</span><i class="ic ic-chevron-right"></i>
<span class="n n--screen">Forgot password<small>A · enter email</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--state">Instructions sent<small>B</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--os">Email link · browser or deep link</span><i class="ic ic-chevron-right"></i>
<span class="n n--state">Set new password<small>C · if in app</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--state">Password updated<small>D</small></span><i class="ic ic-chevron-right"></i>
<span class="n n--screen">Welcome / Login</span>
</div>
</div>
</div>
</template>
<script src="assets/rivjuuu.js"></script>
<script>
var PROPS = {"$preview":{"width":1640,"height":1180}};
class Component extends DCLogic {
  renderVals() { return {}; }
}
Rivjuuu.mount(PROPS, Component);
</script>
</body>
</html>
